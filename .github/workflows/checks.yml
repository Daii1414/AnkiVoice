name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.6 haqumei==0.12.2

      - name: Compile Python
        run: |
          python -m compileall -q anki_gui.py anki_web.py anki_web_page.py voice_pipeline.py sudachi_g2p.py g2p_core.py kana_stress.py anki_tts.py robust_tests.py

      - name: Unit and integration checks
        run: |
          python lab/qc_unit.py
          python lab/quality_unit.py
          python lab/test_g2p_infrastructure.py
          python lab/web_js_check.py
          python lab/integration_check.py
