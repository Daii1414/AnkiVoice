name: checks

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (ubuntu, python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # кэш pip: sudachidict-core весит ~200 МБ, качается один раз
          cache: pip

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff

      - name: "Lint (ruff: syntax errors, undefined names, unused imports)"
        run: python -m ruff check app lab --select E9,F63,F7,F82,F401

      - name: Compile Python
        run: python -m compileall -q app lab

      - name: Unit and integration checks
        run: |
          python lab/qc_unit.py
          python lab/quality_unit.py
          python lab/test_v12_features.py
          python lab/test_en_translit.py
          python lab/web_js_check.py
          python lab/integration_check.py
          python lab/readme_check.py
          python lab/fmt_check.py
          python lab/i18n_check.py

      # батарея чтений: на Linux pyruntime недоступен, kanaize работает
      # через in-process Haqumei (g2p_core.reads) — тот же движок, что и в
      # бою; доменные термины колоды гейтят отдельно (DOMAIN_CASES)
      - name: Kana reading battery
        run: python app/kana_stress.py

  installer:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy==2.4.6 haqumei==0.12.2 e2k
          # exe — артефакт сборки, в репозитории его нет: собираем здесь
          python -m PyInstaller --noconfirm --onefile --windowed --name AnkiVoice `
            --distpath . --workpath "$env:TEMP\pyi" --specpath "$env:TEMP" app/anki_gui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          "building with $($iscc.FullName)"
          & $iscc.FullName "AnkiVoice.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "dist\*.exe" | Select-Object Name, Length

      - name: Smoke test installer (silent install + first run)
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          # Установщик ставится тихо в %LOCALAPPDATA%, проверяется состав
          # файлов и первый запуск чтения — через свежераспакованный pyruntime.
          # Именно этот класс («свежая установка не работает») раньше
          # пропускался: pyruntime распаковывался не туда.
          $setup = Get-ChildItem "dist\AnkiVoice-Setup-*.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "установка вернула код $($p.ExitCode)" }
          $inst = "$env:LOCALAPPDATA\Programs\AnkiVoice"
          python lab\smoke_installed.py $inst
          if ($LASTEXITCODE -ne 0) { throw "smoke-тест не прошёл" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnkiVoice-Setup
          path: dist/AnkiVoice-Setup-*.exe
          retention-days: 14

      - name: Build release body from CHANGELOG
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python lab/release_body.py "${{ github.ref_name }}" > release_body.md
          Get-Content release_body.md -Head 3

      - name: Publish to GitHub Release
        # публикация ТОЛЬКО по тегу: каждый push в main не должен
        # перезаписывать ассет релиза (бинарник перестаёт соответствовать
        # тегу, а параллельные прогоны могут оставить битый файл)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_body.md
          files: dist/AnkiVoice-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
