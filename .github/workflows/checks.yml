name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (ubuntu, python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.6 haqumei==0.12.2

      - name: Compile Python
        run: python -m compileall -q anki_gui.py anki_web.py anki_web_page.py voice_pipeline.py sudachi_g2p.py g2p_core.py kana_stress.py lab

      - name: Unit and integration checks
        run: |
          python lab/qc_unit.py
          python lab/quality_unit.py
          python lab/test_g2p_infrastructure.py
          python lab/test_v12_features.py
          python lab/web_js_check.py
          python lab/integration_check.py
          python lab/readme_check.py
          python lab/fmt_check.py
          python lab/i18n_check.py

  installer:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          "building with $($iscc.FullName)"
          & $iscc.FullName "AnkiVoice.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "dist\*.exe" | Select-Object Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AnkiVoice-Setup
          path: dist/AnkiVoice-Setup-*.exe
          retention-days: 14
