<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="950" viewBox="0 0 1650 950" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <rect width="1650" height="950" fill="#0a0f1a"/>
  <rect x="0" y="0" width="1650" height="950" fill="url(#sheen)"/>
  <defs>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2b" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#0a0f1a" stop-opacity="0"/>
    </linearGradient>
    <g id="ico-box">
      <rect x="-30" y="-30" width="60" height="60" rx="14" fill="#0f1c2e" stroke="#58a6ff" stroke-width="3"/>
    </g>
    <g id="ico-star" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linejoin="round">
      <path d="M0 -17 L4.6 -5.5 L16.8 -5.5 L7 2 L10.4 14 L0 7 L-10.4 14 L-7 2 L-16.8 -5.5 L-4.6 -5.5 Z"/>
    </g>
    <g id="ico-book" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M-17 -14 H-2 V14 H-17 Z"/>
      <path d="M2 -14 H17 V14 H2 Z"/>
      <path d="M0 -14 V14"/>
      <path d="M-13 -7 H-6 M6 -7 H13"/>
    </g>
    <g id="ico-chip" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linejoin="round">
      <rect x="-13" y="-13" width="26" height="26" rx="5"/>
      <rect x="-6" y="-6" width="12" height="12" rx="2"/>
      <path d="M-13 -6 H-19 M-13 6 H-19 M13 -6 H19 M13 6 H19 M-6 -13 V-19 M6 -13 V-19 M-6 13 V19 M6 13 V19"/>
    </g>
    <g id="ico-shield" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 -18 L15 -12 V0 C15 9 8 15 0 18 C-8 15 -15 9 -15 0 V-12 Z"/>
      <path d="M-6 0 L-2 5 L7 -5"/>
    </g>
    <g id="ico-mic" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linecap="round">
      <rect x="-8" y="-19" width="16" height="28" rx="8"/>
      <path d="M-15 -2 V2 a15 15 0 0 0 30 0 V-2"/>
      <path d="M0 17 V23 M-8 23 H8"/>
    </g>
    <g id="arrow" stroke="#58a6ff" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M0 0 V26"/>
      <path d="M-7 18 L0 27 L7 18"/>
    </g>
    <g id="box">
      <rect x="0" y="0" width="1530" height="86" rx="16" fill="#0c1322" stroke="#1f4b7a" stroke-width="2"/>
    </g>
  </defs>

  <text x="60" y="88" font-size="54" font-weight="800" fill="#ffffff">Как это работает</text>
  <rect x="62" y="108" width="82" height="7" fill="#58a6ff"/>

  <!-- 1. карточка -->
  <g transform="translate(60,160)"><use href="#box"/></g>
  <g transform="translate(140,203)"><use href="#ico-box"/><use href="#ico-star"/></g>
  <text x="212" y="218" font-size="34" font-weight="700" fill="#ffffff">Карточка Anki</text>

  <use href="#arrow" x="140" y="246"/>

  <!-- 2. режим чтения -->
  <g transform="translate(60,300)">
    <rect x="0" y="0" width="1530" height="205" rx="16" fill="#0c1322" stroke="#1f4b7a" stroke-width="2"/>
  </g>
  <g transform="translate(140,352)"><use href="#ico-box"/><use href="#ico-book"/></g>
  <text x="212" y="365" font-size="34" font-weight="700" fill="#ffffff">Режим чтения (настройка колоды)</text>
  <g stroke="#58a6ff" stroke-width="3" fill="none">
    <path d="M212 392 V455"/>
    <path d="M212 420 H228"/>
    <path d="M212 455 H228"/>
  </g>
  <circle cx="242" cy="420" r="7" fill="#58a6ff"/>
  <circle cx="242" cy="455" r="7" fill="#58a6ff"/>
  <text x="262" y="431" font-size="29" fill="#ffffff"><tspan font-weight="700">Авто:</tspan> есть фуригана — термин ровно по ней, нет — кандзи</text>
  <text x="262" y="466" font-size="29" fill="#ffffff"><tspan font-weight="700">Только кандзи:</tspan> движок читает иероглифы сам</text>

  <use href="#arrow" x="140" y="505"/>

  <!-- 3. движок -->
  <g transform="translate(60,558)"><use href="#box"/></g>
  <g transform="translate(140,601)"><use href="#ico-box"/><use href="#ico-chip"/></g>
  <text x="212" y="616" font-size="31" fill="#ffffff"><tspan font-weight="700">Движок:</tspan> GPT-SoVITS (127.0.0.1:9880) или IndexTTS 2.5 (127.0.0.1:9881) → OGG</text>

  <use href="#arrow" x="140" y="644"/>

  <!-- 4. QC -->
  <g transform="translate(60,697)"><use href="#box"/></g>
  <g transform="translate(140,740)"><use href="#ico-box"/><use href="#ico-shield"/></g>
  <text x="212" y="755" font-size="31" fill="#ffffff"><tspan font-weight="700">QC v2:</tspan> сигналы качества → перегенерация брака</text>

  <use href="#arrow" x="140" y="783"/>

  <!-- 5. проверка произношения -->
  <g transform="translate(60,836)"><use href="#box"/></g>
  <g transform="translate(140,879)"><use href="#ico-box"/><use href="#ico-mic"/></g>
  <text x="212" y="894" font-size="31" fill="#ffffff"><tspan font-weight="700">Проверка произношения (совет):</tspan> ASR сверяет звук с текстом</text>
</svg>
