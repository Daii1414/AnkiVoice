<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="AnkiVoice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1319"/>
      <stop offset="0.55" stop-color="#141A26"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B9BFF"/>
      <stop offset="1" stop-color="#6D5CF5"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B9BFF" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#8B9BFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#4CD797" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="240" rx="22" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="238.5" rx="21.25" fill="none" stroke="#262E3B" stroke-width="1.5"/>

  <!-- знак приложения -->
  <rect x="56" y="60" width="120" height="120" rx="30" fill="url(#mark)"/>
  <path d="M84 152 L116 88 L148 152" fill="none" stroke="#0F1319" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M99 132 H133" stroke="#0F1319" stroke-width="11" stroke-linecap="round"/>

  <!-- название -->
  <text x="212" y="122" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="66" font-weight="700" letter-spacing="-1.5" fill="#E7ECF5">AnkiVoice</text>
  <text x="214" y="166" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="24" font-weight="500" fill="#97A1B3">Japanese audio for Anki decks — fully offline</text>

  <!-- волна -->
  <g transform="translate(760 60)">
    <rect x="0"   y="52" width="6" height="16" rx="3" fill="url(#wave)"/>
    <rect x="16"  y="36" width="6" height="48" rx="3" fill="url(#wave)"/>
    <rect x="32"  y="20" width="6" height="80" rx="3" fill="url(#wave)"/>
    <rect x="48"  y="4"  width="6" height="112" rx="3" fill="url(#wave)"/>
    <rect x="64"  y="30" width="6" height="60" rx="3" fill="url(#wave)"/>
    <rect x="80"  y="46" width="6" height="28" rx="3" fill="url(#wave)"/>
    <rect x="96"  y="58" width="6" height="4"  rx="2" fill="url(#wave)"/>
    <rect x="112" y="34" width="6" height="52" rx="3" fill="url(#wave)"/>
    <rect x="128" y="14" width="6" height="92" rx="3" fill="url(#wave)"/>
    <rect x="144" y="38" width="6" height="44" rx="3" fill="url(#wave)"/>
    <rect x="160" y="54" width="6" height="12" rx="3" fill="url(#wave)"/>
    <rect x="176" y="28" width="6" height="64" rx="3" fill="url(#wave)"/>
    <rect x="192" y="48" width="6" height="24" rx="3" fill="url(#wave)"/>
    <rect x="208" y="8"  width="6" height="104" rx="3" fill="url(#wave)"/>
    <rect x="224" y="40" width="6" height="40" rx="3" fill="url(#wave)"/>
    <rect x="240" y="56" width="6" height="8"  rx="3" fill="url(#wave)"/>
  </g>

  <text x="1090" y="176" text-anchor="end" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="19" font-weight="600" fill="#4CD797">v1.2</text>
</svg>
