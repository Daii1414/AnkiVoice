      <text x="342" y="395" font-size="16" font-weight="600" fill="#C7D2E4">GPU NVIDIA ≥ 6 ГБ</text>

      <rect x="530" y="366" width="258" height="46" rx="12" fill="#101927" stroke="#24344d" stroke-width="1.2"/>
      <use href="#icoShield" xlink:href="#icoShield" x="552" y="389" color="#4CD797"/>
      <text x="572" y="395" font-size="16" font-weight="600" fill="#C7D2E4">Без облака и телеметрии</text>
    </g>

    <!-- ответ на вопрос «что нужно до установки» -->
    <text x="108" y="452" font-size="17" font-weight="600" fill="#58a6ff" text-decoration="underline">Что нужно до установки</text>
    <text x="296" y="452" font-size="17" fill="#7E8A9C">— движок 6–10 ГБ, модель голоса, AnkiConnect</text>
    <text x="108" y="486" font-size="15" fill="#64707F">Мастер после установки сам подсказывает, что скачать и куда положить.</text>

