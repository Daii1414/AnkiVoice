  <text x="1456" y="32" text-anchor="end" font-size="13" fill="#465162">1500 × 1140 · тёмная тема GitHub · Inter / Segoe UI</text>

  <!-- ============ 1. БАННЕР (картинка doc/hero.svg) ============ -->
  <rect x="44" y="44" width="1412" height="592" rx="26" fill="none" stroke="#26364d" stroke-width="1.2" stroke-dasharray="7 7"/>
  <text x="1456" y="36" text-anchor="end" font-size="13" fill="#5A6675">картинка doc/hero.svg — одна картинка, 1500 × 560</text>

  <g>
    <rect x="60" y="60" width="1380" height="560" rx="18" fill="url(#heroBg)"/>
    <rect x="60" y="60" width="1380" height="560" rx="18" fill="url(#glow)"/>
    <rect x="60.75" y="60.75" width="1378.5" height="558.5" rx="17.25" fill="none" stroke="#1E2A3D" stroke-width="1.5"/>

    <!-- логотип + название -->
    <use href="#logoMark" xlink:href="#logoMark" x="108" y="104"/>
    <text x="200" y="160" font-size="52" font-weight="700" letter-spacing="-1" fill="#E7ECF5">AnkiVoice</text>
    <rect x="484" y="118" width="80" height="36" rx="18" fill="#0f1a2c" stroke="#2a3a55" stroke-width="1.2"/>
    <text x="524" y="142" text-anchor="middle" font-size="16" font-weight="600" fill="#8B9BFF">v1.8</text>

    <!-- обещание -->
    <text x="108" y="236" font-size="32" font-weight="700" fill="#EAF0FA">Озвучка японских карточек Anki</text>
    <text x="108" y="270" font-size="22" fill="#A6B2C4">Голосом GPT-SoVITS или IndexTTS 2.5 — целиком на вашем компьютере</text>
    <text x="108" y="306" font-size="18" fill="#8B97A9">Движок читает иероглифы сам, основное слово — по фуриганы карточки.</text>
    <text x="108" y="332" font-size="18" fill="#8B97A9">Готовый ogg ложится прямо в поля карточки. Без аккаунтов и телеметрии.</text>

    <!-- чипы: что нужно до установки -->
    <g>
      <rect x="108" y="366" width="176" height="46" rx="12" fill="#101927" stroke="#24344d" stroke-width="1.2"/>
      <use href="#icoWin" xlink:href="#icoWin" x="130" y="389" color="#58a6ff"/>
