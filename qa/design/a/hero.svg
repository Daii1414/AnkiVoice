    <rect x="76" y="950" width="420" height="64" rx="12" fill="#0c1322" stroke="#1f4b7a" stroke-width="1.4"/>
    <text x="96" y="978" font-size="16" font-weight="700" fill="#E7ECF5">1 · Карточка Anki</text>
    <text x="96" y="1000" font-size="13" fill="#7E8A9C">текст предложения + фуригана слова</text>

    <use href="#icoArrow" xlink:href="#icoArrow" x="516" y="982" color="#58a6ff"/>

