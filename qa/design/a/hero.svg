<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1500" height="1140" viewBox="0 0 1500 1140"
     role="img" aria-label="Макет первого экрана README AnkiVoice: шапка, обещание, требования, кнопка скачивания и иллюстрация интерфейса"
     xml:lang="ru"
     font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">

  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#101a2b"/>
      <stop offset="0.5" stop-color="#0a0f1a"/>
      <stop offset="1" stop-color="#0b111c"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B9BFF"/>
      <stop offset="1" stop-color="#6D5CF5"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B9BFF"/>
      <stop offset="1" stop-color="#6D5CF5"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#4CD797" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.16" cy="0.02" r="0.62">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>

    <!-- знак приложения (логотип) -->
    <g id="logoMark">
      <rect x="0" y="0" width="72" height="72" rx="20" fill="url(#markGrad)"/>
      <path d="M16.8 55.2 L34.8 16.8 L52.8 55.2" fill="none" stroke="#0F1319" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M25.8 43.2 H46.2" stroke="#0F1319" stroke-width="6.4" stroke-linecap="round"/>
    </g>

    <g id="icoWin" fill="currentColor">
      <rect x="-8" y="-8" width="7" height="7" rx="1.2"/>
      <rect x="1" y="-8" width="7" height="7" rx="1.2"/>
      <rect x="-8" y="1" width="7" height="7" rx="1.2"/>
      <rect x="1" y="1" width="7" height="7" rx="1.2"/>
    </g>
    <g id="icoChip" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="-7" y="-7" width="14" height="14" rx="3"/>
      <rect x="-3" y="-3" width="6" height="6" rx="1.5"/>
      <path d="M-7 -3 H-11 M-7 3 H-11 M7 -3 H11 M7 3 H11 M-3 -7 V-11 M3 -7 V-11 M-3 7 V11 M3 7 V11"/>
    </g>
    <g id="icoShield" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">
      <path d="M0 -9 L7.5 -6 V0 C7.5 4.5 4 7.5 0 9 C-4 7.5 -7.5 4.5 -7.5 0 V-6 Z"/>
      <path d="M-3 0 L-1 2.5 L3.5 -2.5"/>
    </g>
    <g id="icoDownload" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -9 V4"/>
      <path d="M-4.5 0 L0 4.5 L4.5 0"/>
      <path d="M-7.5 6 V8.5 H7.5 V6"/>
    </g>
