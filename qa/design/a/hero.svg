    <text x="1016" y="978" font-size="16" font-weight="700" fill="#E7ECF5">3 · ogg в полях карточки</text>
    <text x="1016" y="1000" font-size="13" fill="#7E8A9C">SentenceAudio / ExpressionAudio, QC v2</text>

    <text x="76" y="1048" font-size="14" fill="#7E8A9C">Всё считается на этом же компьютере — интернет не нужен. Один блок вместо таблицы на 10 строк.</text>
