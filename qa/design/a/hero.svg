    </g>
    <g id="icoCheckCircle">
      <circle r="9" fill="#58a6ff"/>
      <path d="M-4 0 L-1 3 L4.5 -3.5" stroke="#0B1020" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
