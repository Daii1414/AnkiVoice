      <text x="884" y="336" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6F7B8D">ЛИМИТ КАРТОЧЕК</text>
      <rect x="884" y="346" width="100" height="38" rx="8" fill="#121b2b" stroke="#22344d" stroke-width="1.2"/>
      <text x="900" y="370" font-size="14" font-weight="600" fill="#E7ECF5">20</text>
      <text x="998" y="370" font-size="12" fill="#6F7B8D">— это объём работы, а не позиция в колоде</text>

      <rect x="884" y="400" width="500" height="54" rx="12" fill="url(#btnGrad)"/>
